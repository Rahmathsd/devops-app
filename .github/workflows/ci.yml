name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::604275788475:role/GitHubActionsECRRole
          aws-region: us-east-1

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw clean verify

      - name: Build Docker image
        run: docker build -t devops-app:${{ github.sha }} .

      - name: Start application and MySQL
        env:
          APP_IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "MYSQL_PASSWORD=ci_password" > .env
          echo "MYSQL_ROOT_PASSWORD=ci_root_password" >> .env
          docker compose up -d

      - name: Check running containers
        run: docker compose ps

      - name: Test application health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health; then
              exit 0
            fi
            echo "Application not ready yet..."
            sleep 2
          done
          echo "Application failed to become ready"
          docker compose logs
          exit 1

      - name: Test application API
        run: |
          curl -fsS http://localhost:8080/api/users

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region us-east-1 |
          docker login --username AWS --password-stdin 604275788475.dkr.ecr.us-east-1.amazonaws.com

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag devops-app:${{ github.sha }} 604275788475.dkr.ecr.us-east-1.amazonaws.com/devops-app:${{ github.sha }}
          docker push 604275788475.dkr.ecr.us-east-1.amazonaws.com/devops-app:${{ github.sha }}
      - name: Stop containers
        if: always()
        run: docker compose down -v

      - name: Test SSM connection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0ded0f957ec08989b" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker ps"]' \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0ded0f957ec08989b" \
            --region us-east-1

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0ded0f957ec08989b" \
            --region us-east-1 \
            --query "Status" \
            --output text)

          echo "SSM command status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0ded0f957ec08989b" \
              --region us-east-1
            exit 1
          fi

